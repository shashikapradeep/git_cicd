name: backend ci
on: workflow_dispatch
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '25'
      - name: Change the working directory
        run: cd backend
      - name: Install dependencies
        run: npm install
  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps: 
      - name : Run lint
        run: npm run lint --workspace=backend
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: npm run test --workspace=backend