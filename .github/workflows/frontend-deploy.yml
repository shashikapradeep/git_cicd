name: frontend deploy
on: workflow_dispatch
jobs:
  frontend-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '25'
      - name: Install dependencies
        run: npm install 
      - name : Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test